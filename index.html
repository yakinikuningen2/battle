<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BATTLE!</title>
  <meta property="og:type" content="website">
  <meta property="og:title" content="BATTLE!">
  <meta property="og:url" content="https://battle-ivory.vercel.app/">
  <meta property="og:locale" content="ja_JP">
  <meta property="og:image" content="https://battle-ivory.vercel.app/static/ogp.png">
  <meta property="og:image:secure_url" content="https://battle-ivory.vercel.app/static/ogp.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="真っ黒な背景に緑色のスライム">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="BATTLE!">
  <meta name="twitter:image" content="https://battle-ivory.vercel.app/static/ogp.png">
  <meta name="twitter:image:alt" content="真っ黒な背景に緑色のスライム">
  <link rel="canonical" href="https://battle-ivory.vercel.app/">
  <link rel="stylesheet" href="static/style.css">
  <script src="static/script.js" defer></script>
</head>
<body>
  <audio id="battle-bgm" src="static/8bit_Lets-do-this.mp3" loop preload="auto"></audio>
  <div class="slime-display">
    <span id="slime-hp">HP 50 / 50</span>
    <span id="slime-name">すらいむ</span>
    <img src="static/character_monster_slime_green.png" alt="すらいむ" class="slime">
  </div>
  <button type="button" class="menu" aria-label="めにゅー" aria-controls="menu-screen" aria-expanded="false">
    <img src="static/sozai_cman_jp_20260921201755.png" alt="">
  </button>
  <div class = "container">
    <div class="player-status" aria-label="ゆうしゃの じょうたい">
      <div class="player-equipment">
      <button type="button" class="player-name" aria-controls="equipment-screen" aria-expanded="false">ゆうしゃ</button>
      <section id="equipment-screen" aria-label="そうび" hidden>
        <div class="equipment-grid">
          <div class="equipment-group">
            <h2 id="equipment-title">ぶき</h2>
            <div id="equipped-weapon" class="equipment-slots" role="group" aria-label="ぶき そうびなし"></div>
          </div>
          <div class="equipment-group">
            <h2 id="head-title">あたま</h2>
            <div id="equipped-head" class="armor-slot" role="group" aria-label="あたま そうびなし">
              <img id="equipped-sword" src="static/tsurugi_bronze_blue.png" alt="けん" class="item-image" draggable="true" hidden>
            </div>
          </div>
          <div class="equipment-group">
            <h2 id="body-title">からだ</h2>
            <div id="equipped-body" class="armor-slot" role="group" aria-label="からだ そうびなし"></div>
          </div>
          <div class="equipment-group">
            <h2 id="feet-title">あし</h2>
            <div id="equipped-feet" class="armor-slot" role="group" aria-label="あし そうびなし"></div>
          </div>
        </div>
        <button type="button" id="equipment-close">とじる</button>
      </section>
      </div>
      <span>HP <span id="player-hp">20</span> / 20</span>
      <span>MP <span id="player-mp">0</span> / 20</span>
    </div>
    <img src = "static/25351742.png" alt = "ぼっくす" class = "box">
    <img src = "static/25351742.png" class = "textbox" alt="">
    <div class="message">
      <p id="message-text" role="status" aria-live="polite">すらいむ　があらわれた!</p>
      <div id="spell-options" class="spell-options" aria-label="まほうをえらぶ" hidden>
        <button type="button" id="spell-thunder">さんだー（MP 10）</button>
        <button type="button" id="spell-fire">ふぁいあ（MP 20）</button>
      </div>
      <button type="button" id="slime-target" hidden disabled>すらいむ</button>
    </div>
    <div class = "command">
      <button type="button" class="battle">こうげき</button>
      <button type="button" class="magic" aria-expanded="false" aria-controls="spell-options">まほう</button>
      <button type="button" class="item" aria-expanded="false" aria-controls="item-panel">あいてむ</button>
    </div>
    <section id="item-panel" class="item-panel" aria-label="あいてむらん" hidden>
      <button type="button" id="sword-item" class="item-choice" data-item="sword" draggable="true" aria-label="けん">
        <img src="static/tsurugi_bronze_blue.png" alt="" class="item-image" draggable="false">
      </button>
      <button type="button" id="use-yakuso" class="item-choice" data-item="yakuso" draggable="true" aria-label="やくそう。HPを10かいふく。みずとごうせいできる">
        <img src="static/yakuso_02.png" alt="" class="item-image" draggable="false">
      </button>
      <button type="button" id="blue-material" class="item-choice" data-item="material" draggable="true" aria-label="みず。たんどくではつかえない。やくそうやまけんとごうせい">
        <img src="static/portion_01_lightblue_01.png" alt="" class="item-image" draggable="false">
      </button>
      <button type="button" id="use-potion" class="item-choice" data-item="potion" aria-label="かいふくやくをつかう。HPを20かいふく" hidden>
        <img src="static/portion_01_yellowgreen.png" alt="" class="item-image" draggable="false">
      </button>
      <button type="button" id="use-mp-potion" class="item-choice" data-item="mpPotion" aria-label="まほうやくをつかう。MPを20かいふく" hidden>
        <img src="static/portion_01_pink.png" alt="" class="item-image" draggable="false">
      </button>
    </section>
  </div>
  <dialog id="menu-screen" aria-labelledby="menu-title">
    <h2 id="menu-title">めにゅー</h2>
    <div id="menu-options">
      <button type="button" id="menu-monster-book">もんすたーずかん</button>
      <button type="button" id="menu-item-book">あいてむずかん</button>
      <button type="button" id="menu-weapon-book">ぶきずかん</button>
      <button type="button" id="menu-restart">やりなおす</button>
      <section class="bgm-settings" aria-label="BGMのせってい">
        <label for="bgm-volume">BGM おんりょう</label>
        <div class="bgm-volume-row">
          <input type="range" id="bgm-volume" min="0" max="100" step="1" value="50">
          <output id="bgm-volume-value" for="bgm-volume">50%</output>
        </div>
        <button type="button" id="bgm-mute" aria-pressed="false">むおん</button>
      </section>
    </div>
    <div id="monster-book" hidden>
      <div id="monster-list">
        <button type="button" id="monster-select-slime" aria-label="すらいむ">
          <img src="static/character_monster_slime_green.png" alt="" class="monster-book-image">
        </button>
      </div>
      <section id="monster-detail" aria-labelledby="monster-name" hidden>
        <h3 id="monster-name">すらいむ</h3>
        <img src="static/character_monster_slime_green.png" alt="すらいむ" class="monster-book-image">
        <p>にがて：ひ</p>
        <p>からだはまりょくでできている。ぶつりこうげきにつよい。</p>
      </section>
      <button type="button" id="monster-book-back">もどる</button>
    </div>
    <div id="item-book" hidden>
      <div id="item-book-list">
        <button type="button" aria-label="やくそう" data-description="HPを10かいふくする。">
          <img src="static/yakuso_02.png" alt="" class="item-book-image">
        </button>
        <button type="button" aria-label="みず" data-description="なにかとちょうごうできるみず。">
          <img src="static/portion_01_lightblue_01.png" alt="" class="item-book-image">
        </button>
        <button type="button" aria-label="かいふくやく" data-item="potion" data-description="HPを20かいふくする。">
          <img src="static/portion_01_yellowgreen.png" alt="" class="item-book-image">
        </button>
        <button type="button" aria-label="まほうやく" data-item="mpPotion" data-description="MPを20かいふくする">
          <img src="static/portion_01_pink.png" alt="" class="item-book-image">
        </button>
      </div>
      <section id="item-book-detail" aria-labelledby="item-book-name" hidden>
        <h3 id="item-book-name"></h3>
        <img id="item-book-detail-image" src="static/yakuso_02.png" alt="" class="item-book-image">
        <p id="item-book-description"></p>
      </section>
      <button type="button" id="item-book-back">もどる</button>
    </div>
    <div id="weapon-book" hidden>
      <div id="weapon-book-list">
        <button type="button" aria-label="けん" data-description="あたえるだめーじがあがる。">
          <img src="static/tsurugi_bronze_blue.png" alt="" class="item-book-image">
        </button>
        <button type="button" aria-label="まけん" data-description="まりょくをおびたけん。ふつうのけんよりこうげきのだめーじがあがる" data-item="magicSword">
          <img src="static/tsurugi_bronze_sabi_blue.png" alt="" class="item-book-image">
        </button>
      </div>
      <section id="weapon-book-detail" aria-labelledby="weapon-book-name" hidden>
        <button type="button" id="weapon-book-inspect" aria-pressed="false">しらべる</button>
        <h3 id="weapon-book-name"></h3>
        <button type="button" id="weapon-book-image-button" aria-label="ぶきをしらべる" disabled>
          <img id="weapon-book-detail-image" src="static/tsurugi_bronze_blue.png" alt="" class="item-book-image">
        </button>
        <p id="weapon-book-description" role="status" aria-live="polite"></p>
      </section>
      <button type="button" id="weapon-book-back">もどる</button>
    </div>
    <div id="restart-confirmation" role="group" aria-labelledby="restart-question" hidden>
      <p id="restart-question">やりなおしますか？</p>
      <div class="menu-choices">
        <button type="button" id="restart-yes">はい</button>
        <button type="button" id="restart-no">いいえ</button>
      </div>
    </div>
    <p id="menu-status" role="status" aria-live="polite"></p>
    <button type="button" id="menu-close">とじる</button>
  </dialog>
  <dialog id="game-clear" class="result-screen" aria-labelledby="game-clear-title">
    <h1 id="game-clear-title">GAME CLEAR!</h1>
    <button type="button" id="game-clear-restart">やりなおす</button>
  </dialog>
  <dialog id="game-over" class="result-screen" aria-labelledby="game-over-title">
    <h1 id="game-over-title">GAME OVER</h1>
    <button type="button" id="game-over-restart">やりなおす</button>
  </dialog>
</body>
</html>
